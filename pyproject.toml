[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "material-scheduling-agent"
version = "0.1.0"
description = "素材审核与发布排期 Agent"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=1.50,<3",
    "pydantic>=2.7,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.1,<9",
    "pytest-cov>=4.1,<7",
]

[project.scripts]
material-agent = "src.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=runtime/test-temp"

